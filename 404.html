<!doctype html>
<!-- Rastapopolix's user site (GitHub Pages, rastapopolix.github.io): only redirects. Tessera's project site moved
     from /melodee-tess/ to /tessera/ when the repository was renamed (2026-10-23), and GitHub redirects the repository,
     not its Pages site. GitHub serves this page for every path this site does not have: an old /melodee-tess/... or
     /Tessera/... address goes on to the same path under /tessera/ (query and anchor kept); anything else to Tessera's
     page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tessera has moved</title>
<script>
(function () {
  var p = location.pathname, m = /^\/(melodee-tess|tessera)(\/.*)?$/i.exec(p);
  var to = '/tessera' + (m ? (m[2] || '/') : '/') + location.search + location.hash;
  if (to !== p + location.search + location.hash) location.replace(to);
})();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1326; color: #f6f0e0;
         font: 17px/1.5 system-ui, sans-serif; }
  a { color: #ffe296; }
</style>
</head>
<body>
<p>Tessera has moved to <a href="https://rastapopolix.github.io/tessera/">rastapopolix.github.io/tessera</a>.</p>
</body>
</html>
